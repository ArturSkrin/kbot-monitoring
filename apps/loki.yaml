apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: loki
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: loki
      version: "6.30.1"
      sourceRef:
        kind: HelmRepository
        name: grafana
        namespace: flux-system
  values:
    loki:
      auth_enabled: false
      commonConfig:
        replication_factor: 1
      storage:
        type: filesystem
      schemaConfig:
        configs:
          - from: "2024-04-01"
            store: tsdb
            object_store: filesystem
            schema: v13
            index:
              prefix: loki_index_
              period: 24h
      storage_config:
        filesystem:
          directory: /loki/chunks
      limits_config:
        allow_structured_metadata: true
        volume_enabled: true
        retention_period: 72h
    deploymentMode: SingleBinary
    singleBinary:
      replicas: 1
      persistence:
        enabled: true
        size: 10Gi
    backend: { replicas: 0 }
    read: { replicas: 0 }
    write: { replicas: 0 }
    ingester: { replicas: 0 }
    querier: { replicas: 0 }
    queryFrontend: { replicas: 0 }
    queryScheduler: { replicas: 0 }
    distributor: { replicas: 0 }
    compactor: { replicas: 0 }
    indexGateway: { replicas: 0 }
    chunksCache: { enabled: false }
    resultsCache: { enabled: false }
    lokiCanary: { enabled: false }
    gateway: { enabled: false }
    minio: { enabled: false }
    test: { enabled: false }