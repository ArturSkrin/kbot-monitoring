apiVersion: helm.toolkit.fluxcd.io/v2
kind: HelmRelease
metadata:
  name: kube-prometheus-stack
  namespace: monitoring
spec:
  interval: 30m
  timeout: 15m
  chart:
    spec:
      chart: kube-prometheus-stack
      version: "86.1.0"
      sourceRef:
        kind: HelmRepository
        name: prometheus-community
        namespace: flux-system
  install:
    crds: Create
  upgrade:
    crds: CreateReplace
  values:
    alertmanager:
      enabled: false          # не нужен для задачи, экономим ресурсы
    grafana:
      adminPassword: "admin"  # dev-доступ, потом зайдём admin/admin
      service:
        type: ClusterIP
    prometheus:
      prometheusSpec:
        retention: 2d
        resources:
          requests:
            cpu: 200m
            memory: 512Mi
          limits:
            memory: 1200Mi
